[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "taverngym"
version = "1.0.0"
description = "TavernGym: a Hearthstone Battlegrounds solo-mode simulator with a reinforcement-learning interface"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]
# TavernBench model runners (scoring needs none of these)
bench = ["openai>=1.0", "httpx", "requests"]

[project.urls]
Repository = "https://github.com/MCG-NJU/AutoTavern"

[tool.maturin]
manifest-path = "crates/taverngym-py/Cargo.toml"
python-source = "python"
module-name = "taverngym._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 100
target-version = "py310"

[dependency-groups]
train = [
    "gymnasium>=1.4.0,<1.5.0",
    "sb3-contrib>=2.9.2,<2.10.0",
    "sentence-transformers>=6.2.0,<6.3.0",
    "stable-baselines3>=2.9.2,<2.10.0",
    "tensorboard>=2.21.0,<2.22.0",
    "torch>=2.15.0,<2.16.0",
    "wandb>=0.31.0,<0.32.0",
    "weave>=0.54.0",
]

[tool.uv.dependency-groups]
train = { requires-python = ">=3.12" }
